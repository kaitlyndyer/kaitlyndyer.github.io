<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cramlet</title>
    <meta name="description" content="cramlet: bite-size, concept-by-concept study guides with flashcards and quizzes.">
    <script src="theme.js"></script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="brand.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="hub wide">
        <div class="hub-top"><button type="button" id="theme-toggle"></button><button type="button" class="buddy-chip" id="buddy-chip"></button></div>
        <header class="hub-head small">
            <h1 class="hub-logo" id="hub-logo">cramlet</h1>
        </header>

        <!-- Filled in by dashboard.js -->
        <div class="dash" id="dashboard"></div>

        <footer class="hub-foot">Student-made study notes. Not official course material.</footer>
    </main>

    <script src="critters.js"></script>
    <script src="icons.js"></script>
    <script src="progress.js"></script>
    <script src="buddy.js"></script>
    <script src="dashboard.js"></script>
    <script>
        document.getElementById("hub-logo").innerHTML = CRAMLET.logo();
        CRAMLET.theme.mountToggle(document.getElementById("theme-toggle"));
        CRAMLET.buddy.mountChip(document.getElementById("buddy-chip"));
        CRAMLET.buddy.welcomeIfNew();
    </script>
</body>
</html>
